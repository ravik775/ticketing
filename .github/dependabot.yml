# Keeps dependencies, base images and pinned GitHub Actions (by SHA) up to date with weekly PRs;
# every PR runs the full CI (tests, no-skip gate, security scans, e2e on k3d).
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 10
    groups:
      spring-boot:
        patterns: ["org.springframework.boot*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: docker
    directories: [/ticket-api, /ui]
    schedule: {interval: weekly}
