# Continuous delivery.
#   release  on a version tag (v1.2.3): build, scan, push semver-tagged images to GHCR, SBOM, keyless signature,
#            GitHub release with the SBOMs attached.
#   deploy   promote the signed images to an environment by DIGEST (immutable), apply the manifests, reload
#            gateway config, smoke-test. Runs only when a target cluster is configured
#            (repository variable DEPLOY_ENABLED=true + secret KUBE_CONFIG), and the `production` GitHub
#            environment should require reviewer approval (Settings > Environments) - change control.
# The laptop k3d cluster is not reachable from GitHub; locally, deploy with scripts/up.sh.
name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release ${{ matrix.image }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include:
          - image: ticket-service
            context: ticket-api
          - image: ui
            context: ui
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ticketing-${{ matrix.image }}
    outputs:
      ticket-service-digest: ${{ steps.digest.outputs.ticket-service }}
      ui-digest: ${{ steps.digest.outputs.ui }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        if: matrix.image == 'ticket-service'
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test the service (release builds are always fully tested)
        if: matrix.image == 'ticket-service'
        run: |
          ./mvnw -B verify
          bash scripts/check-test-reports.sh 40
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ env.IMAGE }}:scan
      - name: Image vulnerability gate (fixable CRITICAL/HIGH block a release)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:scan
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - id: digest
        run: echo "${{ matrix.image }}=${{ steps.push.outputs.digest }}" >> "$GITHUB_OUTPUT"
      - uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
          output-file: sbom-${{ matrix.image }}.spdx.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Keyless sign by digest
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
      - name: Upload SBOM for the GitHub release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-sbom-${{ matrix.image }}
          path: sbom-${{ matrix.image }}.spdx.json

  github-release:
    name: GitHub release
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-sbom-*
          merge-multiple: true
      - name: Create release with SBOMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" sbom-*.spdx.json --repo "${GITHUB_REPOSITORY}" --generate-notes --verify-tag

  deploy:
    name: Deploy to ${{ inputs.environment || 'production' }}
    needs: release
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ inputs.environment || 'production' }}     # protection rules = approval gate
    env:
      OWNER: ${{ github.repository_owner }}
      SERVICE_DIGEST: ${{ needs.release.outputs.ticket-service-digest }}
      UI_DIGEST: ${{ needs.release.outputs.ui-digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Verify image signatures before deploying (only images built by this repository's workflow)
        run: |
          for pair in "ticket-service@${SERVICE_DIGEST}" "ui@${UI_DIGEST}"; do
            cosign verify "ghcr.io/${OWNER}/ticketing-${pair}" \
              --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          done
      - name: Configure cluster access
        run: |
          mkdir -p ~/.kube
          printf '%s' "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config
          kubectl version
      - name: Apply manifests with images pinned by digest
        run: |
          mkdir -p deploy-overlay
          cat > deploy-overlay/kustomization.yaml <<EOF
          apiVersion: kustomize.config.k8s.io/v1beta1
          kind: Kustomization
          resources: [../k8s]
          images:
            - name: ticketing/ticket-service
              newName: ghcr.io/${OWNER}/ticketing-ticket-service
              digest: ${SERVICE_DIGEST}
            - name: ticketing/ui
              newName: ghcr.io/${OWNER}/ticketing-ui
              digest: ${UI_DIGEST}
          EOF
          kubectl apply -k deploy-overlay
          kubectl -n ticketing rollout status deploy/ticket-service --timeout=300s
          kubectl -n ticketing rollout status deploy/ui --timeout=120s
      - name: Reload gateway configuration
        run: bash scripts/render-kong.sh
      - name: Smoke test
        env:
          BASE: ${{ vars.DEPLOY_BASE_URL }}
        run: bash scripts/e2e.sh
