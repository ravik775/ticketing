# Continuous integration: every push and pull request.
#   build-test     ./mvnw verify (unit + slice + Testcontainers integration) and a gate that FAILS on skipped tests
#   security-scan  dependency + secret scan (blocking on fixable CRITICAL/HIGH), IaC/Dockerfile misconfig (report)
#   e2e            the whole platform on a throw-away k3d cluster in the runner: scripts/up.sh, the 53+ live
#                  end-to-end checks, and the backup restore drill
#   images         container images built, scanned, SBOM-attested and keyless-signed; pushed to GHCR on main
# All third-party actions are pinned to a full commit SHA (supply-chain hardening); Dependabot keeps them current.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: "21"
  K3D_VERSION: v5.9.0

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Build, unit, slice and Testcontainers integration tests
        run: ./mvnw -B verify
      - name: Quality gate - no skipped tests, test count not dropped
        run: bash scripts/check-test-reports.sh 40
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: "**/target/surefire-reports/*.xml"
          retention-days: 14
      - name: Upload service jar
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ticket-service-jar
          path: ticket-api/target/ticket-service.jar
          retention-days: 7

  security-scan:
    name: Security scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write          # upload SARIF to GitHub code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Resolve dependencies into ~/.m2 (the scanner reads them locally, avoiding Maven Central rate limits)
        run: ./mvnw -B -q dependency:go-offline
      - name: Dependency and secret scan (blocking on fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          skip-dirs: ticket-api/target,ticket-core/target,ticket-security/target
      - name: Kubernetes manifest and Dockerfile misconfiguration scan (report)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"                # known, documented findings (e.g. readOnlyRootFilesystem on vendor images)
          format: sarif
          output: trivy-config.sarif
      - name: Publish misconfiguration findings to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config

  e2e:
    name: End-to-end on k3d
    needs: build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: Install k3d ${{ env.K3D_VERSION }}
        run: |
          curl -fsSL -o /usr/local/bin/k3d "https://github.com/k3d-io/k3d/releases/download/${K3D_VERSION}/k3d-linux-amd64"
          chmod +x /usr/local/bin/k3d
          k3d version
      - name: Bring up the platform (cluster, PKI, databases, Keycloak, service, UI, Kong, WAF, policies)
        run: bash scripts/up.sh
      - name: End-to-end checks (security, tenancy, locking, WAF, mTLS, NetworkPolicies)
        run: bash scripts/e2e.sh
      - name: Backup restore drill (PostgreSQL PITR + MongoDB oplog replay)
        run: bash scripts/restore-drill.sh all
      - name: Collect diagnostics on failure
        if: failure()
        run: |
          mkdir -p diag
          kubectl get pods -A -o wide > diag/pods.txt 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > diag/events.txt 2>&1 || true
          for ns in edge gateway auth ticketing; do
            for p in $(kubectl -n "$ns" get pods -o name 2>/dev/null); do
              kubectl -n "$ns" logs "$p" --all-containers --tail=300 > "diag/${ns}_${p#pod/}.log" 2>&1 || true
            done
          done
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics
          path: diag/
          retention-days: 7

  images:
    name: Image ${{ matrix.image }}
    needs: [build-test, security-scan]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write                 # push to ghcr.io
      id-token: write                 # keyless signing (Sigstore OIDC)
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ticket-service
            context: ticket-api
          - image: ui
            context: ui
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/ticketing-${{ matrix.image }}
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the tested jar
        if: matrix.image == 'ticket-service'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ticket-service-jar
          path: ticket-api/target
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=pr
      - name: Build image (load locally for scanning)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          load: true
          tags: ${{ env.IMAGE }}:scan
          labels: ${{ steps.meta.outputs.labels }}
      - name: Image vulnerability scan (blocking on fixable CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:scan
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image
        id: push
        if: env.PUSH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
      - name: SBOM (SPDX) as a build artifact
        if: env.PUSH == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          artifact-name: sbom-${{ matrix.image }}.spdx.json
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: env.PUSH == 'true'
      - name: Keyless sign the pushed image by digest
        if: env.PUSH == 'true'
        run: cosign sign --yes "${IMAGE}@${{ steps.push.outputs.digest }}"
