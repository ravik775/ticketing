spring:
  application:
    name: ticket-service
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/ticketing}
    username: ${POSTGRES_USER:ticketing_app}
    password: ${POSTGRES_PASSWORD:ticketing_app}
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/ticketing}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema is owned by Flyway (ticket-core/src/main/resources/db/migration)
  flyway:
    enabled: true

ticketing:
  security:
    issuer: ${OIDC_ISSUER:https://ticketing.localtest.me:8443/auth/realms/ticketing}
    jwk-set-uri: ${OIDC_JWKS_URI:https://keycloak.auth.svc.cluster.local:8443/auth/realms/ticketing/protocol/openid-connect/certs}
    client-id: ${OIDC_CLIENT_ID:ticketing-ui}   # only access tokens issued to this client (azp) are accepted
    ssl-bundle: ""
  # A lock older than this is stale and another approver may pick the ticket up (the takeover is
  # recorded in the history). PT0S = locks never expire; they must be decided or explicitly unlocked.
  lock-timeout: ${TICKET_LOCK_TIMEOUT:PT0S}
  mtls:
    enabled: true            # fail closed by default
    allowed-callers: kong-gateway

server:
  error:
    include-message: never
    include-stacktrace: never
