apiVersion: v1
kind: Service
metadata:
  name: ticket-service
  namespace: ticketing
spec:
  selector: {app: ticket-service}
  ports:
    - {name: https, port: 8443, targetPort: 8443}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: ticketing
spec:
  replicas: 1
  selector:
    matchLabels: {app: ticket-service}
  template:
    metadata:
      labels: {app: ticket-service}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: ticket-service
          image: ticketing/ticket-service:dev
          imagePullPolicy: IfNotPresent
          ports:
            - {name: https, containerPort: 8443}
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: k8s}
            - {name: POSTGRES_URL, value: "jdbc:postgresql://postgres.ticketing.svc.cluster.local:5432/ticketing"}
            - {name: POSTGRES_USER, value: ticketing_app}
            - {name: OIDC_ISSUER, value: "https://ticketing.localtest.me:8443/auth/realms/ticketing"}
            - {name: OIDC_JWKS_URI, value: "https://keycloak.auth.svc.cluster.local:8443/auth/realms/ticketing/protocol/openid-connect/certs"}
          envFrom:
            - secretRef: {name: ticket-service-env}   # POSTGRES_PASSWORD, MONGODB_URI
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          # TCP probes: a kubelet cannot present the client certificate that mTLS requires.
          startupProbe:
            tcpSocket: {port: 8443}
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            tcpSocket: {port: 8443}
            periodSeconds: 10
          resources:
            requests: {cpu: 200m, memory: 384Mi}
            limits: {memory: 768Mi}
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tls
          secret: {secretName: ticket-service-tls}
        - name: tmp
          emptyDir: {}
