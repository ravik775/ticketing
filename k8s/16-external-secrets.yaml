# Kubernetes Secrets synchronised from OpenBao by External Secrets Operator (installed from k8s/vendor).
# Same Secret names as before, so the workloads are unchanged. Least privilege per namespace:
#   ticketing     -> secret/ticketing/*     (+ secret/shared/keycloak-db for the database init)
#   auth          -> secret/auth/*          (+ secret/shared/keycloak-db)
#   observability -> secret/observability/*
# Each store authenticates with its OWN namespace's service account (Kubernetes auth role in OpenBao) and
# may be used only from that namespace (conditions). Rotation: change the value in OpenBao; the Secret is
# refreshed within refreshInterval (or immediately: scripts/secrets-bootstrap.sh --sync).
apiVersion: v1
kind: ServiceAccount
metadata: {name: secrets-reader, namespace: ticketing}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: secrets-reader, namespace: auth}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: secrets-reader, namespace: observability}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: {name: openbao-ticketing}
spec:
  conditions: [{namespaces: [ticketing]}]
  provider:
    vault:
      server: https://openbao.secrets.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider: {type: Secret, name: openbao-tls, namespace: secrets, key: ca.crt}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: ticketing
          serviceAccountRef: {name: secrets-reader, namespace: ticketing}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: {name: openbao-auth}
spec:
  conditions: [{namespaces: [auth]}]
  provider:
    vault:
      server: https://openbao.secrets.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider: {type: Secret, name: openbao-tls, namespace: secrets, key: ca.crt}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: auth
          serviceAccountRef: {name: secrets-reader, namespace: auth}
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata: {name: openbao-observability}
spec:
  conditions: [{namespaces: [observability]}]
  provider:
    vault:
      server: https://openbao.secrets.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider: {type: Secret, name: openbao-tls, namespace: secrets, key: ca.crt}
      auth:
        kubernetes:
          mountPath: kubernetes
          role: observability
          serviceAccountRef: {name: secrets-reader, namespace: observability}
---
# ---------------------------------------------------------------- ticketing
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: postgres-credentials, namespace: ticketing}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao-ticketing}
  target:
    name: postgres-credentials
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      data: {POSTGRES_USER: postgres}          # not a secret
  data:
    - {secretKey: POSTGRES_PASSWORD, remoteRef: {key: ticketing/postgres, property: superuser_password}}
    - {secretKey: TICKETING_DB_PASSWORD, remoteRef: {key: ticketing/postgres, property: app_password}}
    - {secretKey: KEYCLOAK_DB_PASSWORD, remoteRef: {key: shared/keycloak-db, property: password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: mongo-credentials, namespace: ticketing}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao-ticketing}
  target:
    name: mongo-credentials
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      data: {MONGO_INITDB_ROOT_USERNAME: mongoadmin}
  data:
    - {secretKey: MONGO_INITDB_ROOT_PASSWORD, remoteRef: {key: ticketing/mongo, property: root_password}}
    - {secretKey: MONGO_APP_PASSWORD, remoteRef: {key: ticketing/mongo, property: app_password}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: mongo-keyfile, namespace: ticketing}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao-ticketing}
  target: {name: mongo-keyfile, creationPolicy: Owner}
  data:
    - {secretKey: mongo.key, remoteRef: {key: ticketing/mongo-keyfile, property: key}}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: ticket-service-env, namespace: ticketing}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao-ticketing}
  target:
    name: ticket-service-env
    creationPolicy: Owner
    template:
      data:
        POSTGRES_PASSWORD: "{{ .app_db }}"
        MONGODB_URI: "mongodb://ticketing_app:{{ .app_mongo }}@mongo.ticketing.svc.cluster.local:27017/ticketing?authSource=ticketing"
  data:
    - {secretKey: app_db, remoteRef: {key: ticketing/postgres, property: app_password}}
    - {secretKey: app_mongo, remoteRef: {key: ticketing/mongo, property: app_password}}
---
# ---------------------------------------------------------------- auth
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: keycloak-env, namespace: auth}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao-auth}
  target:
    name: keycloak-env
    creationPolicy: Owner
    template:
      mergePolicy: Merge
      data: {KC_BOOTSTRAP_ADMIN_USERNAME: admin}
  data:
    - {secretKey: KC_DB_PASSWORD, remoteRef: {key: shared/keycloak-db, property: password}}
    - {secretKey: KC_BOOTSTRAP_ADMIN_PASSWORD, remoteRef: {key: auth/keycloak-admin, property: password}}
---
# ---------------------------------------------------------------- observability
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: grafana-admin, namespace: observability}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: openbao-observability}
  target: {name: grafana-admin, creationPolicy: Owner}
  data:
    - {secretKey: password, remoteRef: {key: observability/grafana, property: admin_password}}
