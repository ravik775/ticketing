apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Applied after cert-manager and External Secrets are installed (scripts/up.sh). The Kong declarative-config Secret is
# produced by scripts/render-kong.sh because it embeds the Keycloak public key and Kong's client cert.
resources:
  - 00-namespaces.yaml
  - 10-pki.yaml
  - 15-secrets-manager.yaml
  - 16-external-secrets.yaml
  - 20-postgres.yaml
  - 21-mongo.yaml
  - 30-keycloak.yaml
  - 40-ticket-service.yaml
  - 50-ui.yaml
  - 60-kong.yaml
  - 70-network-policies.yaml
  - 80-waf.yaml
  - 90-observability.yaml
  - 91-observability-network-policies.yaml

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: keycloak-realm
    namespace: auth
    files:
      - realm-ticketing.json=keycloak/realm-ticketing.json
  - name: grafana-dashboards
    namespace: observability
    files:
      - ticketing-overview.json=grafana/ticketing-overview.json

# No credentials in Git. Every infrastructure secret is generated randomly and stored in OpenBao
# (scripts/secrets-bootstrap.sh), then synced into Kubernetes Secrets by External Secrets
# (16-external-secrets.yaml). The External Secrets Operator itself (k8s/vendor) is installed by up.sh
# with server-side apply before this kustomization, because its CRDs are larger than client-side apply allows.
