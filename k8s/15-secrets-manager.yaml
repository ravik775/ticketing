# Secrets manager: OpenBao (open-source, MPL-2.0 fork of HashiCorp Vault) in namespace `secrets`.
# Every infrastructure credential lives here (random, generated by scripts/secrets-bootstrap.sh), never in
# Git. External Secrets Operator (k8s/vendor) copies them into the Kubernetes Secrets the workloads use
# (k8s/16-external-secrets.yaml); each namespace can read only its own path.
#
# LOCAL: one instance, Raft storage on a volume, TLS from the cluster CA, auto-unseal with a static key held in
#   a Kubernetes Secret (created by the bootstrap, not in Git); root token + recovery key saved by the bootstrap
#   to ~/.ticketing/openbao-init.json on the operator's machine (outside the repository).
# PRODUCTION: AWS Secrets Manager (or OpenBao/Vault HA with 3-5 Raft nodes), auto-unseal with AWS KMS, no
#   long-lived root token (revoked; admins use SSO), audit device to the SIEM, dynamic DB credentials (docs/07).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: openbao
  namespace: secrets
spec:
  secretName: openbao-tls
  commonName: openbao
  dnsNames: [openbao, openbao.secrets, openbao.secrets.svc, openbao.secrets.svc.cluster.local, localhost]
  ipAddresses: [127.0.0.1]
  usages: [server auth]
  privateKey: {algorithm: RSA, size: 2048}
  issuerRef: {name: ticketing-ca, kind: ClusterIssuer}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: openbao-config
  namespace: secrets
data:
  config.hcl: |
    ui            = false
    disable_mlock = true
    listener "tcp" {
      address       = "0.0.0.0:8200"
      tls_cert_file = "/tls/tls.crt"
      tls_key_file  = "/tls/tls.key"
      tls_min_version = "tls12"
    }
    storage "raft" {
      path    = "/openbao/data"
      node_id = "openbao-0"
    }
    # Local auto-unseal. Production: seal "awskms" { kms_key_id = "..." }
    seal "static" {
      current_key_id = "local-1"
      current_key    = "file:///unseal/key"
    }
    # Audit device (declarative, as OpenBao requires): every request, secret values HMAC-hashed, to stdout ->
    # shipped to the SIEM (Loki) by Alloy.
    audit "file" "stdout" {
      description = "audit log to stdout for the SIEM"
      options {
        file_path = "/dev/stdout"
      }
    }
    api_addr     = "https://openbao.secrets.svc.cluster.local:8200"
    cluster_addr = "https://openbao-0.openbao.secrets.svc.cluster.local:8201"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao
  namespace: secrets
---
# OpenBao validates the service-account tokens presented by External Secrets (Kubernetes auth method) via the
# TokenReview API: it may review tokens, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-token-reviewer
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: system:auth-delegator}
subjects: [{kind: ServiceAccount, name: openbao, namespace: secrets}]
---
apiVersion: v1
kind: Service
metadata:
  name: openbao
  namespace: secrets
spec:
  clusterIP: None
  selector: {app: openbao}
  ports:
    - {name: https, port: 8200, targetPort: 8200}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: openbao
  namespace: secrets
spec:
  serviceName: openbao
  replicas: 1
  selector: {matchLabels: {app: openbao}}
  template:
    metadata:
      labels: {app: openbao}
    spec:
      serviceAccountName: openbao
      automountServiceAccountToken: true        # needed for the TokenReview call (Kubernetes auth)
      securityContext: {runAsNonRoot: true, runAsUser: 100, runAsGroup: 1000, fsGroup: 1000, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: openbao
          image: openbao/openbao:2.7.1
          args: [server, -config=/etc/openbao/config.hcl]
          env:
            - {name: BAO_ADDR, value: "https://127.0.0.1:8200"}
            - {name: BAO_CACERT, value: /tls/ca.crt}
          ports:
            - {name: https, containerPort: 8200}
          readinessProbe:
            # ready = initialized and unsealed (sealed/uninitialised return non-200)
            httpGet: {path: /v1/sys/health, port: https, scheme: HTTPS}
            periodSeconds: 10
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          resources: {requests: {cpu: 20m, memory: 48Mi}, limits: {cpu: 300m, memory: 192Mi}}
          volumeMounts:
            - {name: config, mountPath: /etc/openbao}
            - {name: data, mountPath: /openbao/data}
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: unseal, mountPath: /unseal, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: config, configMap: {name: openbao-config}}
        - {name: tls, secret: {secretName: openbao-tls}}
        - {name: unseal, secret: {secretName: openbao-unseal, defaultMode: 0400}}
        - {name: tmp, emptyDir: {}}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        resources: {requests: {storage: 256Mi}}
---
# ---------------------------------------------------------------- network: only External Secrets may talk to OpenBao
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-all, namespace: secrets}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: openbao-ingress-from-external-secrets, namespace: secrets}
spec:
  podSelector: {matchLabels: {app: openbao}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: external-secrets}}
      ports: [{protocol: TCP, port: 8200}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: openbao-egress, namespace: secrets}
spec:
  podSelector: {matchLabels: {app: openbao}}
  policyTypes: [Egress]
  egress:
    - ports:                                   # Kubernetes API (TokenReview) and DNS
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-all, namespace: external-secrets}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: external-secrets-egress, namespace: external-secrets}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: secrets}}
          podSelector: {matchLabels: {app: openbao}}
      ports: [{protocol: TCP, port: 8200}]
    - ports:                                   # Kubernetes API (watch ExternalSecrets, write Secrets, request SA tokens)
        - {protocol: TCP, port: 443}
        - {protocol: TCP, port: 6443}
    - to:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: kube-system}}
          podSelector: {matchLabels: {k8s-app: kube-dns}}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
