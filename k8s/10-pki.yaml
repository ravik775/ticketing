# Private PKI for the demo (cert-manager). One root CA signs every workload certificate:
#   waf-edge-tls        browser -> WAF (TLS, the public entry point)
#   kong-edge-tls       WAF -> Kong (TLS, verified by the WAF)
#   kong-client-tls     Kong -> ticket-service (mTLS client identity, CN=kong-gateway)
#   ticket-service-tls  ticket-service server cert (mTLS server side, also the trust anchor ca.crt)
#   keycloak-tls        Kong / ticket-service -> Keycloak (TLS)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-bootstrap
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ticketing-root-ca
  namespace: cert-manager
spec:
  isCA: true
  commonName: ticketing-root-ca
  secretName: ticketing-root-ca
  duration: 87600h
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-bootstrap
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: ticketing-ca
spec:
  ca:
    secretName: ticketing-root-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: waf-edge
  namespace: edge
spec:
  secretName: waf-edge-tls
  dnsNames: [ticketing.localtest.me, localhost]
  usages: [server auth]
  privateKey: {algorithm: RSA, size: 2048}
  issuerRef: {name: ticketing-ca, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kong-edge
  namespace: gateway
spec:
  secretName: kong-edge-tls
  dnsNames: [ticketing.localtest.me, localhost]
  usages: [server auth]
  privateKey: {algorithm: RSA, size: 2048}
  issuerRef: {name: ticketing-ca, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kong-client
  namespace: gateway
spec:
  secretName: kong-client-tls
  commonName: kong-gateway
  usages: [client auth]
  privateKey: {algorithm: RSA, size: 2048}
  issuerRef: {name: ticketing-ca, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: ticket-service
  namespace: ticketing
spec:
  secretName: ticket-service-tls
  commonName: ticket-service
  dnsNames:
    - ticket-service
    - ticket-service.ticketing
    - ticket-service.ticketing.svc
    - ticket-service.ticketing.svc.cluster.local
  usages: [server auth]
  privateKey: {algorithm: RSA, size: 2048}
  issuerRef: {name: ticketing-ca, kind: ClusterIssuer}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak
  namespace: auth
spec:
  secretName: keycloak-tls
  commonName: keycloak
  dnsNames:
    - keycloak
    - keycloak.auth
    - keycloak.auth.svc
    - keycloak.auth.svc.cluster.local
    - localhost                      # admin console via kubectl port-forward (internal only)
  usages: [server auth]
  privateKey: {algorithm: RSA, size: 2048}
  issuerRef: {name: ticketing-ca, kind: ClusterIssuer}
