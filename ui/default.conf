# Replaces the image's default server. Security headers are set here (not globally in Kong) so they
# apply only to the SPA and never override Keycloak's own headers on /auth.
server {
    listen       8080;
    server_name  _;
    root         /usr/share/nginx/html;
    server_tokens off;

    # Everything is same-origin: scripts/styles from this server, API and token calls via Kong.
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    # The login callback URL carries the authorization code: never leak it in a Referer header.
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cache-Control "no-cache" always;

    location / {
        try_files $uri /index.html;
    }
}
